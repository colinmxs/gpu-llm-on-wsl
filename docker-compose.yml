version: '3.8'

services:
  llm-gradio:
    build: .
    container_name: gpu-llm-gradio
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/app/cache
      - MODELS_DIR=/app/models
      - CACHE_DIR=/app/cache
    ports:
      - "7860:7860"  # Gradio Frontend
      - "8888:8888"  # Jupyter
    volumes:
      - ~/hugging-face/models:/app/models
      - ~/hugging-face/cache:/app/cache
    command: python /app/frontend/gradio_frontend.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
